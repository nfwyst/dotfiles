set -sg escape-time 5
set -g default-terminal "tmux-256color"
set -g status-interval 60
set -su terminal-features
set -s terminal-features[100] 'xterm*:RGB'
set -s terminal-features[101] 'xterm-ghostty:clipboard:cstyle:focus:overline:RGB:strikethrough:sync:usstyle'

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

unbind C-b
set -g prefix M-p
bind M-p send-prefix
set -g mouse on
bind \` switch-client -t'{marked}'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

set -g status-position bottom
set -g default-shell /opt/homebrew/bin/nu
set -g focus-events on

# kill pane: 只 SIGKILL nu 的 children (starship/zoxide/atuin/carapace),
# 不碰 nu 本身 — nu 收到 TERM 会向 pgid 转发, 兄弟 pane 共享 pgid 会被一锅端。
# children 不清掉则 tmux 在 POLLHUP 自旋 100% CPU。
bind x run-shell -b ' \
  PID=#{pane_pid}; \
  for CHILD in $(pgrep -P "$PID" 2>/dev/null); do \
    for GRAND in $(pgrep -P "$CHILD" 2>/dev/null); do \
      kill -KILL "$GRAND" 2>/dev/null; \
    done; \
    kill -KILL "$CHILD" 2>/dev/null; \
  done; \
  true' \; kill-pane

# panel select
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# open window in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# panel resizing
bind -r h resize-pane -L
bind -r l resize-pane -R
bind -r j resize-pane -D
bind -r k resize-pane -U

# go to last session
bind L switch-client -l

# move window to left
bind -n M-i swap-window -t -1

# move window to right
bind -n M-o swap-window -t +1

# use visual selection mode as vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# set env
if-shell -F '#{m/r:^/opt/homebrew/bin(:|$),#{E:PATH}}' '' \
    'setenv -gF PATH "/opt/homebrew/bin:#{E:PATH}"'
setenv -g SNACKS_KITTY "1"
setenv -g TERMINAL "ghostty"
setenv -g XDG_CONFIG_HOME "$HOME/.config"
setenv -g XDG_BIN_HOME "$HOME/.local/bin"
setenv -g XDG_DATA_HOME "$HOME/.local/share"
setenv -g GIT_CONFIG_GLOBAL "$HOME/.config/.gitconfig"

# enable passthrough
set -g allow-passthrough on

# Remove TPM state left by servers that loaded the former runtime-managed config.
unbind I
unbind U
unbind M-u
set -gu @plugin
setenv -gu TMUX_PLUGIN_MANAGER_PATH

# default theme (overridden by als_reader on macOS)
set -g @tmux_power_theme               'everforest'
set -g @tmux_power_right_arrow_icon    ' '
set -g @tmux_power_left_arrow_icon     ' '
set -g @tmux_power_left_a              ''
set -g @tmux_power_show_user           false
set -g @tmux_power_show_host           false
set -g @tmux_power_right_y             '%H:%M:%S'
set -g @tmux_power_right_z             '%m-%d•%A'

# Plugins are pinned Git submodules; TPM does not own or load them.
run 'mkdir -p "$XDG_DATA_HOME/tmux/plugins/tmux-which-key" && \
    if [ ! -f "$XDG_DATA_HOME/tmux/plugins/tmux-which-key/init.tmux" ] || \
       [ "$XDG_CONFIG_HOME/tmux/tmux-which-key.yaml" -nt "$XDG_DATA_HOME/tmux/plugins/tmux-which-key/init.tmux" ] || \
       [ "$HOME/.config/tmux/plugins/tmux-which-key/plugin/build.py" -nt "$XDG_DATA_HOME/tmux/plugins/tmux-which-key/init.tmux" ]; then \
        "$HOME/.config/tmux/plugins/tmux-which-key/plugin/build.py" \
        "$XDG_CONFIG_HOME/tmux/tmux-which-key.yaml" \
        "$XDG_DATA_HOME/tmux/plugins/tmux-which-key/init.tmux"; \
    fi && tmux source-file "$XDG_DATA_HOME/tmux/plugins/tmux-which-key/init.tmux"'

# boot/reload authority: theme per system mode; als_reader (LaunchAgent com.user.als-theme, 30s poll) applies live ambient switches
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' \
    'source-file ~/.config/tmux/tmux-dark.conf' \
    'source-file ~/.config/tmux/tmux-light.conf'

# ── fix: 单击切 pane + 消除 tab [tmux] 闪烁 ──
# copy-mode 时窗口名始终显示进程名, 不再显示 [tmux]
set -g automatic-rename-format '#{pane_current_command}'

# 实测: 触控板 tap 只产生 MouseUp, 故切焦点挂在 Up (Down 覆盖真实鼠标点击)。
# 鼠标所在 pane 非活动 → 只 select-pane 聚焦并吞掉事件 (避免 nvim 进 VISUAL);
# 已是活动 pane → 转发给应用。-t= 让 #{pane_active} 在鼠标所在 pane 求值。
bind -n MouseDown1Pane if -F -t= '#{==:#{pane_active},0}' 'select-pane -t=' 'send-keys -M'
bind -n MouseUp1Pane   if -F -t= '#{==:#{pane_active},0}' 'select-pane -t=' 'send-keys -M'

# tab 单击切换: 触控板 tap 只产生 Up, 默认 MouseDown1Status 挂 Down 单击切不动, 补 Up
bind -n MouseUp1Status switch-client -t =
