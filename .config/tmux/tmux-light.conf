# tmux light theme (sourced by als_reader)
# snow TC (#fffafa) is unreadable on light bg, use dark accent instead
set -g @tmux_power_theme '#4a4a4a'

# light gradient (mirror of official dark values, inverted for light bg)
set -g @tmux_power_g0 '#e8e8e8'
set -g @tmux_power_g1 '#dddddd'
set -g @tmux_power_g2 '#d0d0d0'
set -g @tmux_power_g3 '#c0c0c0'
set -g @tmux_power_g4 '#8a8a8a'
run '$HOME/.config/tmux/plugins/tmux-power/tmux-power.tmux'
set -g mode-style "bg=#4a4a4a,fg=#e8e8e8" # 7.23:1 AAA (plugin default fg=#8a8a8a is 2.57:1)

# tab title: only window name, no index/flags (1-cell padding each side + 1-cell separator gap)
set -g window-status-format         '#[fg=#4a4a4a,bg=#d0d0d0] #W '
set -g window-status-current-format '#[fg=#e8e8e8,bg=#4a4a4a,bold] #W '
set -g window-status-separator      ' '
setw -g pane-border-style "fg=#c8c8c8"
setw -g pane-active-border-style "fg=#c8c8c8"
