# tmux light theme (sourced by tmux-dark-notify)
set -g @tmux_power_theme 'snow'
run '$HOME/.config/tmux/plugins/tmux-power/tmux-power.tmux'

# tab title: only window name, no index/flags
set -g window-status-format         '#[fg=#262626,bg=#3a3a3a] #[fg=#fffafa,bg=#3a3a3a] #W #[fg=#3a3a3a,bg=#262626] '
set -g window-status-current-format '#[fg=#262626,bg=#fffafa] #[fg=#262626,bg=#fffafa,bold] #W #[fg=#fffafa,bg=#262626,none] '
setw -g pane-border-style "fg=#c8c8c8"
setw -g pane-active-border-style "fg=#c8c8c8"
run 'mkdir -p $HOME/.local/state/delta && printf "[delta]\n    features = hoopoe\n" > $HOME/.local/state/delta/theme.gitconfig'
run 'mkdir -p $HOME/.local/state/theme && printf "light\n" > $HOME/.local/state/theme/mode'
