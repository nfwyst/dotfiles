# tmux dark theme (sourced by als_reader)
set -g @tmux_power_theme 'everforest'

# official dark gradient (tmux-power defaults, made explicit)
set -g @tmux_power_g0 '#262626'
set -g @tmux_power_g1 '#303030'
set -g @tmux_power_g2 '#3a3a3a'
set -g @tmux_power_g3 '#444444'
set -g @tmux_power_g4 '#626262'
run '$HOME/.config/tmux/plugins/tmux-power/tmux-power.tmux'

# tab title: only window name, no index/flags (1-cell padding each side + 1-cell separator gap)
set -g window-status-format         '#[fg=#a7c080,bg=#3a3a3a] #W '
set -g window-status-current-format '#[fg=#262626,bg=#a7c080,bold] #W '
set -g window-status-separator      ' '
setw -g pane-border-style "fg=#555555"
setw -g pane-active-border-style "fg=#555555"
